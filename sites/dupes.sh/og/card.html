<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dupes share card</title>

<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#faf9f6;color:#292c30;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:grid;grid-template-columns:500px 1fr;font-synthesis:none}
.copy{padding:66px 0 64px 72px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;font-size:34px;font-weight:700;letter-spacing:-1.3px}
.mark{display:grid;place-items:center;color:#faf9f6;background:#af573f;height:44px;width:44px;border-radius:12px 12px 12px 3px;font:italic 36px Georgia,serif}

h1 em{font:italic 400 1em Georgia,serif;letter-spacing:-1.5px;color:#af573f}
p{margin-top:24px;font-size:22px;line-height:1.5;color:#727874;max-width:400px}
.url{margin-top:auto;font:500 22px ui-monospace,"SF Mono",Menlo,monospace;padding-top:28px}
.art{background:#e9ede6;margin:60px 60px 60px 0;border-radius:14px;padding:0 28px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.label{font-size:20px;font-weight:550}
.crop{width:584px;height:291px;overflow:hidden;border:1px solid #e7e4dd;border-radius:10px;background:#faf9f6}

</style></head><body>
<section class="copy">

</section>
<section class="art">
